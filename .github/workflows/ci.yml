# CI mínimo: build + tests + lint en cada push/PR.
# Nota: elegí la imagen de runner que traiga el Xcode que usás
# (ver github.com/actions/runner-images). El simulador se detecta solo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install tools
        run: brew install xcbeautify swiftlint || true

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Usando simulador: $DEVICE"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "__APP_NAME__" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            test 2>&1 | xcbeautify

      - name: SwiftLint
        run: swiftlint lint --strict
