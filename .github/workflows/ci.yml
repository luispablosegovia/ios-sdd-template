# CI: canonical verification gate for instantiated iOS projects.
# In the template repository itself, xcodebuild is skipped because there is no .xcodeproj yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install tools
        run: brew install xcbeautify swiftlint swiftformat || true

      - name: Run verification gate
        run: |
          chmod +x scripts/verify.sh
          bash scripts/verify.sh
