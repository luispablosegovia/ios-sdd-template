# CI: canonical verification gate for instantiated iOS projects.
# In the template repository itself, xcodebuild is skipped because there is no .xcodeproj yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install tools
        run: brew install xcbeautify swiftlint swiftformat gitleaks

      - name: Run verification gate
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          STRICT_VERIFY: 1
        run: |
          chmod +x scripts/verify.sh
          bash scripts/verify.sh

      - name: Smoke-test project instantiation
        run: |
          chmod +x scripts/smoke-new-project.sh
          bash scripts/smoke-new-project.sh
